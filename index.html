<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Metal Result Cards</title>

  <style>
    :root {
      --red: #d71920;
      --bg: #f7e9e4;
      --text: #111;
      --gap: 5px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: transparent;

      font-family: Arial, Helvetica, sans-serif;

      overflow: hidden;
    }

    /*
      Layout responsive a due righe.

      Riga 1:
      DHP | ETP | OT66

      Riga 2:
      OTX | SIMILORO

      Le due righe si dividono automaticamente
      tutta l'altezza disponibile del widget.
    */
    #cards {
      width: 100%;
      height: 100%;

      display: grid;

      /*
        Sei colonne virtuali.

        Le prime tre card occupano 2 colonne ciascuna:
        2 + 2 + 2 = 6

        Le ultime due card occupano 3 colonne ciascuna:
        3 + 3 = 6
      */
      grid-template-columns: repeat(6, minmax(0, 1fr));

      /*
        Le due righe occupano ciascuna metà
        dell'altezza disponibile.
      */
      grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: var(--gap);

      padding: 2px;

      overflow: hidden;
    }

    /*
      Impostazione comune a tutte le card.

      Per default ogni card occupa 2 colonne,
      quindi le prime tre riempiono la prima riga.
    */
    .card {
      grid-column: span 2;

      min-width: 0;
      min-height: 0;

      width: 100%;
      height: 100%;

      border: 2px solid var(--red);

      background: var(--bg);

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      padding: 4px 5px;

      overflow: hidden;
    }

    /*
      Quarta e quinta card:
      ciascuna occupa metà larghezza.
    */
    .card:nth-child(4),
    .card:nth-child(5) {
      grid-column: span 3;
    }

    /*
      Etichetta superiore.
    */
    .label {
      width: 100%;

      color: var(--text);

      font-size: clamp(
        9px,
        min(1vw, 2.5vh),
        13px
      );

      line-height: 1;

      text-align: center;

      white-space: nowrap;

      margin-bottom: 4px;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    /*
      Valore numerico.
    */
    .value {
      width: 100%;

      color: var(--red);

      font-size: clamp(
        15px,
        min(2vw, 5vh),
        28px
      );

      font-weight: 700;

      line-height: 1;

      text-align: center;

      white-space: nowrap;

      font-variant-numeric: tabular-nums;

      overflow: hidden;
      text-overflow: clip;
    }
  </style>
</head>

<body>

  <div id="cards"></div>

  <script>
    "use strict";

    const EPSILON = 1e-12;

    /*
      Ordine con cui devono essere visualizzati
      i cartellini.
    */
    const ORDER = [
      "DHP",
      "ETP",
      "OTTONE 66",
      "OT X",
      "SIMILORO"
    ];

    /*
      Etichette visualizzate nel widget.
    */
    const DISPLAY_LABELS = {
      "DHP": "DHP",
      "ETP": "ETP",
      "OTTONE 66": "OT66",
      "OT X": "OTX",
      "SIMILORO": "SIMILORO"
    };

    /*
      Normalizzazione dei nomi ricevuti da SAS.
    */
    function normalizeName(value) {
      return String(value ?? "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, " ");
    }

    /*
      Ricerca della posizione della colonna SAS
      usando uno o più possibili nomi.
    */
    function findColumnIndex(columns, wantedLabels) {

      const wanted = wantedLabels.map(normalizeName);

      for (let i = 0; i < columns.length; i++) {

        const col = columns[i] || {};

        const candidates = [
          col.label,
          col.name,
          col.dataItemName,
          col.dataItemLabel
        ].filter(
          value =>
            value !== undefined &&
            value !== null
        );

        for (const candidate of candidates) {

          if (
            wanted.includes(
              normalizeName(candidate)
            )
          ) {
            return i;
          }
        }
      }

      return -1;
    }

    /*
      Conversione robusta dei valori numerici.

      Gestisce anche numeri italiani del tipo:
      1.234,56
    */
    function toNumber(value) {

      if (typeof value === "number") {
        return value;
      }

      if (typeof value === "string") {

        const cleaned = value
          .trim()
          .replace(/\s/g, "")
          .replace(/\./g, "")
          .replace(",", ".");

        const number = Number(cleaned);

        return Number.isFinite(number)
          ? number
          : NaN;
      }

      return Number(value);
    }

    /*
      Formattazione italiana.

      Se il valore assoluto è compreso tra
      zero e uno vengono mostrati tre decimali.

      Negli altri casi vengono mostrati
      due decimali.
    */
    function formatItalian(value) {

      const abs = Math.abs(value);

      const decimals =
        abs > 0 && abs < 1
          ? 3
          : 2;

      return new Intl.NumberFormat(
        "it-IT",
        {
          minimumFractionDigits: decimals,
          maximumFractionDigits: decimals
        }
      ).format(value);
    }

    /*
      Restituisce l'etichetta breve da mostrare.
    */
    function displayLabel(category) {

      const normalized =
        normalizeName(category);

      return (
        DISPLAY_LABELS[normalized] ||
        String(category ?? "").trim()
      );
    }

    /*
      Determina l'ordine di visualizzazione.
    */
    function categoryOrder(category) {

      const normalized =
        normalizeName(category);

      const index =
        ORDER.indexOf(normalized);

      return index === -1
        ? 999
        : index;
    }

    /*
      Disegna le card.
    */
    function render(message) {

      const cards =
        document.getElementById("cards");

      cards.innerHTML = "";

      if (
        !message ||
        !Array.isArray(message.data) ||
        !Array.isArray(message.columns)
      ) {
        return;
      }

      /*
        CARTELLINO:
        DHP, ETP, OTTONE 66, OT X, SIMILORO

        RISULTATO_METALLO_K:
        valore numerico da visualizzare
      */
      const categoryIndex =
        findColumnIndex(
          message.columns,
          ["CARTELLINO"]
        );

      const valueIndex =
        findColumnIndex(
          message.columns,
          ["RISULTATO_METALLO_K"]
        );

      if (
        categoryIndex < 0 ||
        valueIndex < 0
      ) {
        return;
      }

      /*
        Preparazione dei dati.
      */
      const rows = message.data

        .map(
          (row, rowIndex) => ({
            rowIndex: rowIndex,
            category: row[categoryIndex],
            value: toNumber(
              row[valueIndex]
            )
          })
        )

        /*
          Elimina righe senza categoria,
          valori non numerici e valori nulli.
        */
        .filter(
          item =>
            item.category !== null &&
            item.category !== undefined &&
            String(item.category).trim() !== "" &&
            Number.isFinite(item.value) &&
            Math.abs(item.value) > EPSILON
        )

        /*
          Ordine:
          DHP
          ETP
          OTTONE 66
          OT X
          SIMILORO
        */
        .sort(
          (a, b) => {

            const orderA =
              categoryOrder(a.category);

            const orderB =
              categoryOrder(b.category);

            if (orderA !== orderB) {
              return orderA - orderB;
            }

            return String(a.category)
              .localeCompare(
                String(b.category),
                "it"
              );
          }
        );

      /*
        Creazione delle card HTML.
      */
      rows.forEach(
        item => {

          const card =
            document.createElement("div");

          card.className = "card";

          /*
            Etichetta.
          */
          const label =
            document.createElement("div");

          label.className = "label";

          label.textContent =
            displayLabel(item.category);

          /*
            Valore.
          */
          const value =
            document.createElement("div");

          value.className = "value";

          value.textContent =
            formatItalian(item.value);

          /*
            Composizione card.
          */
          card.appendChild(label);

          card.appendChild(value);

          cards.appendChild(card);
        }
      );
    }

    /*
      Ricezione dati dal contenuto basato sui dati
      di SAS Visual Analytics.
    */
    function onMessage(event) {

      if (
        !event ||
        !event.data
      ) {
        return;
      }

      const message =
        event.data;

      if (
        !Array.isArray(message.data) ||
        !Array.isArray(message.columns)
      ) {
        return;
      }

      render(message);
    }

    /*
      Listener per i messaggi inviati da SAS.
    */
    window.addEventListener(
      "message",
      onMessage,
      false
    );
  </script>

</body>
</html>
