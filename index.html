<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metal Result Cards</title>
  <style>
    :root {
      --red: #d71920;
      --bg: #f7e9e4;
      --text: #111;
      --gap: 7px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #cards {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
      gap: var(--gap);
      align-items: stretch;
      padding: 2px;
    }

    .card {
      min-width: 0;
      min-height: 72px;
      border: 2px solid var(--red);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 5px 6px;
      overflow: hidden;
    }

    .label {
      color: var(--text);
      font-size: clamp(12px, 1.1vw, 16px);
      line-height: 1.05;
      text-align: center;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    .value {
      color: var(--red);
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="cards"></div>
  <script>
    "use strict";

    const EPSILON = 1e-12;
    const ORDER = ["DHP","ETP","OTTONE 66","OT X","SIMILORO"];
    const DISPLAY_LABELS = {
      "DHP":"DHP",
      "ETP":"ETP",
      "OTTONE 66":"OT66",
      "OT X":"OTX",
      "SIMILORO":"SIMILORO"
    };

    function normalizeName(value) {
      return String(value ?? "").trim().toUpperCase().replace(/\s+/g, " ");
    }

    function findColumnIndex(columns, wantedLabels) {
      const wanted = wantedLabels.map(normalizeName);
      for (let i = 0; i < columns.length; i++) {
        const col = columns[i] || {};
        const candidates = [col.label,col.name,col.dataItemName,col.dataItemLabel]
          .filter(v => v !== undefined && v !== null);
        for (const candidate of candidates) {
          if (wanted.includes(normalizeName(candidate))) return i;
        }
      }
      return -1;
    }

    function toNumber(value) {
      if (typeof value === "number") return value;
      if (typeof value === "string") {
        const cleaned = value.trim().replace(/\s/g,"").replace(/\./g,"").replace(",",".");
        const n = Number(cleaned);
        return Number.isFinite(n) ? n : NaN;
      }
      return Number(value);
    }

    function formatItalian(value) {
      const abs = Math.abs(value);
      const decimals = abs > 0 && abs < 1 ? 3 : 2;
      return new Intl.NumberFormat("it-IT", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      }).format(value);
    }

    function displayLabel(category) {
      const normalized = normalizeName(category);
      return DISPLAY_LABELS[normalized] || String(category ?? "").trim();
    }

    function categoryOrder(category) {
      const idx = ORDER.indexOf(normalizeName(category));
      return idx === -1 ? 999 : idx;
    }

    function render(message) {
      const cards = document.getElementById("cards");
      cards.innerHTML = "";

      if (!message || !Array.isArray(message.data) || !Array.isArray(message.columns)) return;

      const categoryIndex = findColumnIndex(message.columns, ["CARTELLINO"]);
      const valueIndex = findColumnIndex(message.columns, ["RISULTATO_METALLO_K"]);
      if (categoryIndex < 0 || valueIndex < 0) return;

      const rows = message.data
        .map((row, rowIndex) => ({
          rowIndex,
          category: row[categoryIndex],
          value: toNumber(row[valueIndex])
        }))
        .filter(item =>
          item.category !== null &&
          item.category !== undefined &&
          String(item.category).trim() !== "" &&
          Number.isFinite(item.value) &&
          Math.abs(item.value) > EPSILON
        )
        .sort((a, b) => {
          const oa = categoryOrder(a.category);
          const ob = categoryOrder(b.category);
          if (oa !== ob) return oa - ob;
          return String(a.category).localeCompare(String(b.category), "it");
        });

      rows.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = displayLabel(item.category);

        const value = document.createElement("div");
        value.className = "value";
        value.textContent = formatItalian(item.value);

        card.appendChild(label);
        card.appendChild(value);
        cards.appendChild(card);
      });
    }

    function onMessage(event) {
      if (!event || !event.data) return;
      const message = event.data;
      if (!Array.isArray(message.data) || !Array.isArray(message.columns)) return;
      render(message);
    }

    window.addEventListener("message", onMessage, false);
  </script>
</body>
</html>
